name: pg_flutter_sdk
description: "Flutter plugin for the PG Payment SDK: UPI, card and net-banking checkout via the native iOS and Android SDKs."
version: 0.1.0
homepage: https://github.com/AteequeJ/pg_sdk_flutter
repository: https://github.com/AteequeJ/pg_sdk_flutter
issue_tracker: https://github.com/AteequeJ/pg_sdk_flutter/issues
topics:
  - payments
  - upi
  - checkout

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pgsdk.flutter
        pluginClass: PgFlutterSdkPlugin
      ios:
        pluginClass: PgFlutterSdkPlugin
